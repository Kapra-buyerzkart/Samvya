name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, Lint, Tests, Doctor & Size Budget
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 1. Strict Typecheck
        run: npm run typecheck

      - name: 2. ESLint Flat Config
        run: npm run lint

      - name: 3. Unit Tests
        run: npm test

      - name: 4. Expo Doctor Dependency Health
        run: npx expo-doctor

      - name: 5. Bundle Size Budget Check
        run: node scripts/check-bundle-budget.js
